<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Practice 11</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <main>
        <section>
            <h1 class="number-1-header">
                Номер 1. Работа с селекторами
            </h1>
            <ul class="list-of-users">
                <li>Анна</li>
                <li>Виктор</li>
                <li>Борис</li>
            </ul>
            <button type="button" id="addUserButton">Добавить пользователя</button>
        </section>
        <section>
            <h1 class="number-2-header">
                Номер 2. Список пользователей
            </h1>
            <div id="container">
                <p class="text">Первый параграф</p>
                <p class="text special">Второй параграф</p>
                <p class="text">Третий параграф</p>
                <p class="text">Четвёртый параграф</p>
            </div>
        </section>
        <section class="number3">
            <h1 class="number-3-header">
                Номер 3. Data-атрибуты и вычисления
            </h1>
            <div class="item" data-price="100">Товар 1</div>
            <div class="item active" data-price="200">Товар 2</div>
            <div class="item" data-price="150">Товар 3</div>
        </section>
    </main>
    <script src="src/script.js"></script>
</body>
</html>
