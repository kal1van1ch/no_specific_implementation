<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="styles/style.css">
    <title>Практика 12</title>
</head>
<body>
    <main>
        <section id="number1">
            <h1>НОМЕР 1</h1>
            <p>Количество кликов:</p>
            <p id="number1_counter">0</p>
            <button id="number1_button">Нажми для увеличения кликов</button>
        </section>
        <section id="number2">
            <h1>НОМЕР 2</h1>
            <input type="text" id="number2_input" placeholder="Введите имя">
            <br>
            <button id="number2_button">Привет!</button>
        </section>
        <section id="number3">
            <h1>НОМЕР 3</h1>
            <input type="radio" id="number3_radio_dark" name="theme" value="dark">
            <label for="number3_radio_dark">Тёмная тема</label>
            <input type="radio" id="number3_radio_light" name="theme" value="light">
            <label for="number3_radio_light">Светлая тема</label>
        </section>
        <section id="number4">
            <h1>НОМЕР 4</h1>
            <ol id="TOOD-list-list"></ol>
            <input type="text" id="TODO-list" placeholder="Введите задачу">
            <br>
            <button id="number4_button">Добавить задачу</button>
        </section>
        <section id="number5">
            <h1>НОМЕР 5</h1>
            <div id="number5_square" style="width: 50px; height: 50px; border: 2px solid; display: inline-block;"></div>
            <br>
            <button id="number5_button_plus">+</button>
            <button id="number5_button_minus">-</button>
        </section>
    </main>
    <script src="src/script.js"></script>
</body>
</html>
